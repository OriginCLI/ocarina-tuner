name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Pitch detector tests (desktop C++)
        run: |
          cmake -S tests/dsp -B build-dsp -DCMAKE_BUILD_TYPE=Release
          cmake --build build-dsp
          ./build-dsp/dsp_tests

      - name: Unit tests and release APK
        run: ./gradlew :core:test :app:assembleRelease --stacktrace

      - name: Name the APK
        run: cp app/build/outputs/apk/release/app-release.apk "ocarina-trainer-v0.1.${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: ocarina-trainer-v0.1.${{ github.run_number }}
          path: ocarina-trainer-v0.1.${{ github.run_number }}.apk

      # Every build of main becomes a GitHub Release; the in-app "Check for update" reads these.
      - name: Publish release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v0.1.${{ github.run_number }}" \
            "ocarina-trainer-v0.1.${{ github.run_number }}.apk" \
            --title "Ocarina Trainer 0.1.${{ github.run_number }}" \
            --notes "$(git log -1 --pretty=%B)" \
            --latest
